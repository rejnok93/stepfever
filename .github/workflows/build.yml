name: Build StepFever for Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Umožní spustit kompilaci i ručně tlačítkem

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stepfever-local-server-version
          path: dist/ # Složka, kam Vite vygeneruje hotové HTML/JS
          retention-days: 7
          
