name: CI

on:
  #push:
  #  branches: [main]
  #pull_request:
  #  branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Debug - List generated folders
        run: |
          echo "=== Obsah složky packages/app ==="
          ls -la packages/app || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stepfever-web-build
          path: |
            packages/core/dist/
          retention-days: 5
